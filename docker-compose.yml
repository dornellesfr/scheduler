services:
  backend:
    build:
      context: ./backend
    working_dir: /var/www/html
    volumes:
      - ./backend:/var/www/html
    ports:
      - "8000:8000"
    command: >-
      sh -c "composer install --no-interaction --prefer-dist --optimize-autoloader &&
      php artisan migrate --seed --force &&
      php -S 0.0.0.0:8000 -t public public/index.php"
    environment:
      DB_CONNECTION: pgsql
      DB_HOST: database
      DB_PORT: ${DB_PORT:?DB_PORT must be set in .env}
      DB_DATABASE: ${DB_DATABASE:?DB_DATABASE must be set in .env}
      DB_USERNAME: ${DB_USERNAME:?DB_USERNAME must be set in .env}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set in .env}
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          php -r '$$connection = @fsockopen("127.0.0.1", 8000);
          exit($$connection ? 0 : 1);'
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s
    depends_on:
      database:
        condition: service_healthy

  database:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DB_DATABASE:?DB_DATABASE must be set in .env}
      POSTGRES_USER: ${DB_USERNAME:?DB_USERNAME must be set in .env}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set in .env}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
