services:
  backend:
    build:
      context: ./backend
    working_dir: /var/www/html
    volumes:
      - ./backend:/var/www/html
    ports:
      - "8000:8000"
    command: >-
      sh -c "export DB_CONNECTION=pgsql DB_HOST=database DB_PORT=5432
      DB_DATABASE=scheduler DB_USERNAME=scheduler DB_PASSWORD=scheduler;
      php artisan migrate --seed --force &&
      php -S 0.0.0.0:8000 -t public public/index.php"
    environment:
      DB_CONNECTION: pgsql
      DB_HOST: database
      DB_PORT: 5432
      DB_DATABASE: scheduler
      DB_USERNAME: scheduler
      DB_PASSWORD: scheduler
    depends_on:
      database:
        condition: service_healthy

  mobile:
    build:
      context: ./mobile
    working_dir: /app
    volumes:
      - ./mobile:/app
    ports:
      - "8081:8081"
    depends_on:
      - backend

  database:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: scheduler
      POSTGRES_USER: scheduler
      POSTGRES_PASSWORD: scheduler
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scheduler -d scheduler"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
